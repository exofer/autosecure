<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autosecure | Web Management Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">
          <i class="fas fa-shield-alt"></i>
        </div>
        <div class="brand-text">
          <h1>Autosecure</h1>
          <span class="badge">v2.0 Web Edition</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <div class="nav-section">
        <div class="nav-section-title">Core Operations</div>
        <a class="nav-item active" data-view="overview" onclick="App.navigate('overview')">
          <i class="fas fa-chart-pie"></i>
          <span>Overview</span>
        </a>
        <a class="nav-item" data-view="accounts" onclick="App.navigate('accounts')">
          <i class="fas fa-users"></i>
          <span>Accounts</span>
        </a>
        <a class="nav-item" data-view="secure" onclick="App.navigate('secure')">
          <i class="fas fa-lock"></i>
          <span>Securing Studio</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Communications</div>
        <a class="nav-item" data-view="emails" onclick="App.navigate('emails')">
          <i class="fas fa-envelope-open-text"></i>
          <span>Webmail Inbox</span>
        </a>
        <a class="nav-item" data-view="tools" onclick="App.navigate('tools')">
          <i class="fas fa-toolbox"></i>
          <span>Minecraft Tools</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Configuration</div>
        <a class="nav-item" data-view="bots" onclick="App.navigate('bots')">
          <i class="fas fa-robot"></i>
          <span>Bot Fleet</span>
        </a>
        <a class="nav-item" data-view="builder" onclick="App.navigate('builder')">
          <i class="fas fa-magic"></i>
          <span>Discord Designer</span>
        </a>
        <a class="nav-item" data-view="proxies" onclick="App.navigate('proxies')">
          <i class="fas fa-network-wired"></i>
          <span>Proxies</span>
        </a>
      </div>

      <div class="nav-section">
        <div class="nav-section-title">Account & Access</div>
        <a class="nav-item" data-view="license" onclick="App.navigate('license')">
          <i class="fas fa-ticket-alt"></i>
          <span>License & Billing</span>
        </a>
        <a class="nav-item" id="nav-item-admin" data-view="admin" onclick="App.navigate('admin')">
          <i class="fas fa-user-shield"></i>
          <span>Owner Console</span>
        </a>
        <a class="nav-item" data-view="guide" onclick="App.navigate('guide')">
          <i class="fas fa-book"></i>
          <span>Documentation</span>
        </a>
      </div>

      <!-- User Session Card in Footer -->
      <div class="sidebar-footer">
        <div class="user-card" onclick="App.openUserSwitchModal()" title="Click to Switch User / Login">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <div class="user-info">
            <div class="user-id-text" id="sidebar-user-id">Loading ID...</div>
            <div class="user-role-badge" id="sidebar-user-role">
              <i class="fas fa-circle" style="font-size:0.5rem;"></i> Active
            </div>
          </div>
          <i class="fas fa-chevron-right" style="font-size:0.75rem;color:var(--text-dim);"></i>
        </div>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="main-wrapper">
      <!-- Topbar Header -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" onclick="App.toggleMobileSidebar()">
            <i class="fas fa-bars"></i>
          </button>
          <h2 class="page-title" id="page-title-text">Dashboard Overview</h2>
        </div>

        <div class="topbar-right">
          <div class="status-pill">
            <span class="status-dot"></span>
            <span>Database Connected</span>
          </div>

          <button class="btn btn-secondary btn-sm" onclick="App.openUserSwitchModal()">
            <i class="fas fa-user-circle"></i> Switch User
          </button>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="content-container" id="view-content">
        <!-- Rendered dynamically by views -->
      </main>
    </div>
  </div>

  <!-- Toast and Modal Engine Scripts -->
  <script src="/js/components/toasts.js"></script>
  <script src="/js/components/modal.js"></script>
  <script src="/js/api.js"></script>

  <!-- View Modules -->
  <script src="/js/views/overview.js"></script>
  <script src="/js/views/accounts.js"></script>
  <script src="/js/views/secure.js"></script>
  <script src="/js/views/emails.js"></script>
  <script src="/js/views/tools.js"></script>
  <script src="/js/views/bots.js"></script>
  <script src="/js/views/builder.js"></script>
  <script src="/js/views/proxies.js"></script>
  <script src="/js/views/license.js"></script>
  <script src="/js/views/admin.js"></script>
  <script src="/js/views/guide.js"></script>

  <!-- App Bootstrap -->
  <script src="/js/app.js"></script>
</body>
</html>
