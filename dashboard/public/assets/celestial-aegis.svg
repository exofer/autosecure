<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" fill="none">
  <defs>
    <linearGradient id="shieldFace" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="goldFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="coreEnergy" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.4" />
    </linearGradient>
    <filter id="aegisGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ambient Backlight Aura -->
  <path d="M300 70 L480 160 L480 390 C480 520 300 620 300 620 C300 620 120 520 120 390 L120 160 Z" 
        fill="#f59e0b" opacity="0.22" filter="url(#aegisGlow)" />
  
  <!-- Outer Gold Rim -->
  <path d="M300 80 L470 165 L470 385 C470 505 300 600 300 600 C300 600 130 505 130 385 L130 165 Z" 
        stroke="url(#goldFacetLight)" stroke-width="4" fill="url(#shieldFace)" />
  
  <!-- Facet Left -->
  <path d="M300 80 L130 165 L130 385 C130 505 300 600 300 600 L300 80 Z" 
        fill="#0b101b" opacity="0.6" />
  
  <!-- Central Ridge Highlight -->
  <line x1="300" y1="80" x2="300" y2="600" stroke="#fbbf24" stroke-width="2" opacity="0.8" />

  <!-- Inner Sacred Bevel Lines -->
  <path d="M300 130 L430 195 L430 370 C430 470 300 550 300 550 C300 550 170 470 170 370 L170 195 Z" 
        stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4" fill="none" opacity="0.6" />

  <!-- The Nova Star Core -->
  <g transform="translate(300, 340)">
    <circle cx="0" cy="0" r="55" fill="url(#coreEnergy)" filter="url(#aegisGlow)" opacity="0.35" />
    <circle cx="0" cy="0" r="32" fill="url(#coreEnergy)" opacity="0.85" />
    <!-- 8-point Golden Star -->
    <path d="M0 -45 L8 -12 L40 -12 L14 8 L24 40 L0 20 L-24 40 L-14 8 L-40 -12 L-8 -12 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="6" fill="#f59e0b" />
  </g>
</svg>