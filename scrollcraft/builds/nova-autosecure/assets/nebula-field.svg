<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <radialGradient id="nebulaCore" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18" />
      <stop offset="30%" stop-color="#d97706" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraBeam" cx="30%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#07090e" />
  <!-- Nebula Clouds -->
  <circle cx="960" cy="480" r="650" fill="url(#nebulaCore)" filter="url(#glow)" />
  <ellipse cx="550" cy="380" rx="500" ry="350" fill="url(#auroraBeam)" filter="url(#glow)" />
  <ellipse cx="1400" cy="520" rx="450" ry="300" fill="url(#nebulaCore)" filter="url(#glow)" opacity="0.6" />
  <!-- Starlight constellation grid -->
  <g opacity="0.45">
    <circle cx="320" cy="180" r="1.5" fill="#f8fafc" />
    <circle cx="450" cy="260" r="1" fill="#f59e0b" />
    <circle cx="820" cy="140" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="1120" cy="220" r="1.2" fill="#fbbf24" />
    <circle cx="1540" cy="190" r="1.8" fill="#f8fafc" />
    <circle cx="1680" cy="340" r="1" fill="#fbbf24" />
    <circle cx="240" cy="640" r="1.2" fill="#f8fafc" />
    <circle cx="680" cy="780" r="1.5" fill="#f59e0b" />
    <circle cx="1280" cy="820" r="2" fill="#ffffff" />
    <circle cx="1720" cy="720" r="1" fill="#f8fafc" />
  </g>
</svg>